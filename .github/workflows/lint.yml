name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install shellcheck
      - run: shellcheck -S warning install.sh uninstall.sh claude/hooks/*.sh claude/statusline.sh
      - run: for f in sakura/*.zsh zshrc-block.zsh; do zsh -n "$f"; done
      - run: python3 -m py_compile sakura/live.py
      - run: brew install lua && cd tests && lua test_live.lua && lua test_panel.lua && lua test_pet.lua && lua test_bubble.lua
      - run: shellcheck -S warning tests/run.sh docs/make-gifs/*.sh
      - run: python3 -m py_compile sakura/replay.py
      - run: python3 -m py_compile sakura/codeview.py && python3 tests/test_codeview.py
      - run: python3 -m py_compile sakura/hub.py sakura/tokens.py && python3 tests/test_tools.py
      - run: shellcheck -S warning claude/hooks/guard.sh claude/hooks/nudge.sh
      - run: python3 -m py_compile sakura/ask.py
      - run: shellcheck -S warning tests/test_uninstall.sh tests/test_install.sh && bash tests/test_uninstall.sh && bash tests/test_install.sh
